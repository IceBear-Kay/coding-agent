[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coding-agent"
version = "0.1.0"
description = "A locally executed coding agent built from first principles."
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
    "pypdf>=5,<7",
    "python-docx>=1.1,<2",
    "python-dotenv>=1,<2",
]

[project.scripts]
coding-agent = "coding_agent.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/coding_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
addopts = ["-ra"]
pythonpath = ["src"]
testpaths = ["tests"]
